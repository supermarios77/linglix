name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for turbo affected detection

      - uses: pnpm/action-setup@v4
        with:
          version: 10 # or latest stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit Tests
        run: pnpm turbo test --filter='...[origin/${{ github.base_ref || github.ref_name }}]' # affected + dependents

  build:
    runs-on: ubuntu-latest
    needs: [lint, test-unit] # Only build if lint & unit pass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter='...[origin/${{ github.base_ref || github.ref_name }}]'

      - name: Upload build artifacts (optional for later jobs)
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            apps/web/.next/**
            apps/web/public/**
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linglix/e2e playwright install --with-deps
      - name: Start dev server & run E2E
        run: pnpm turbo test:e2e --filter=@linglix/e2e
